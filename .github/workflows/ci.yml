# Public CI for UnifiedFloppyTool (MF-1635).
#
# The public repository holds only what the qmake application build needs
# (see scripts/release/app_only_files.py in the development repository).
# There is no test suite here, so this workflow proves exactly one thing:
# the application compiles on the three release platforms.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    timeout-minutes: 60
    name: Linux (${{ matrix.qt_version }}, ${{ matrix.cxx_std }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt_version: '6.7.3'
            cxx_std: 'c++17'
            qmake_extra: ''
          - qt_version: '6.10.1'
            cxx_std: 'c++20'
            qmake_extra: 'CONFIG+=cxx20'
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          host: linux
          target: desktop
          modules: 'qtserialport'
          cache: true
      - name: System dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libusb-1.0-0-dev libgl1-mesa-dev
      - name: Build (qmake)
        run: |
          mkdir build && cd build
          qmake ../UnifiedFloppyTool.pro CONFIG+=release ${{ matrix.qmake_extra }}
          make -j"$(nproc)"
          file UnifiedFloppyTool

  macos:
    timeout-minutes: 60
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: mac
          target: desktop
          modules: 'qtserialport'
          cache: true
      - name: Build (qmake)
        run: |
          mkdir build && cd build
          qmake ../UnifiedFloppyTool.pro CONFIG+=release CONFIG+=cxx20
          make -j"$(sysctl -n hw.ncpu)"

  windows:
    timeout-minutes: 90
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.1'
          host: windows
          target: desktop
          arch: win64_mingw
          modules: 'qtserialport'
          tools: 'tools_mingw1310'
          add-tools-to-path: true
          cache: true
      - name: Build (qmake)
        shell: bash
        run: |
          mkdir build && cd build
          qmake ../UnifiedFloppyTool.pro CONFIG+=release CONFIG+=cxx20
          mingw32-make -j"$(nproc)"
          file release/UnifiedFloppyTool.exe
